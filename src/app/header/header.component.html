<header id="header" class="site-header">
  <div class="header-inner">
    <a routerLink="/home" class="brand" (click)="closeMenus()" aria-label="Peralummoottil Kudumbayogam home">
      <span class="brand-mark">
        <img src="assets/img/logo.jpg" alt="Peralummoottil Kudumbayogam family tree" />
      </span>
      <span class="brand-copy">
        <span class="brand-place">Kallooppara</span>
        <span class="brand-name">Peralummoottil Kudumbayogam</span>
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [class.is-open]="menuOpen"
      (click)="toggleNavBar()"
      [attr.aria-expanded]="menuOpen"
      aria-controls="primary-navigation"
      aria-label="Toggle navigation"
    >
      <span></span><span></span><span></span>
    </button>

    <nav id="primary-navigation" class="site-nav" [class.is-open]="menuOpen" aria-label="Primary navigation">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenus()">Home</a>

      <div class="nav-dropdown" [class.is-open]="dropdownOpen">
        <button type="button" class="dropdown-trigger" (click)="toggleDropdown($event)" [attr.aria-expanded]="dropdownOpen">
          Kudumbayogam
          <i class="fa fa-angle-down" aria-hidden="true"></i>
        </button>
        <div class="dropdown-panel">
          <a routerLink="/about" routerLinkActive="active" (click)="closeMenus()">About</a>
          <a routerLink="/history" routerLinkActive="active" (click)="closeMenus()">History</a>
          <a routerLink="/office-bearers" routerLinkActive="active" (click)="closeMenus()">Office bearers</a>
          <a routerLink="/administration" routerLinkActive="active" (click)="closeMenus()">Administration</a>
          <a routerLink="/finance" routerLinkActive="active" (click)="closeMenus()">Finance</a>
          <a routerLink="/venue" routerLinkActive="active" (click)="closeMenus()">Venue</a>
          <a routerLink="/family-tree" routerLinkActive="active" (click)="closeMenus()">Family tree</a>
          <a routerLink="/gallery" routerLinkActive="active" (click)="closeMenus()">Gallery</a>
        </div>
      </div>

      <a routerLink="/genealogy" routerLinkActive="active" (click)="closeMenus()">Genealogy</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenus()">Contact</a>
    </nav>
  </div>
</header>
